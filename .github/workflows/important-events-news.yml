name: Important Events NEWS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "calculate = LINE送信せずに取得結果を確認 / notify = LINE送信"
        required: true
        type: choice
        default: calculate
        options:
          - calculate
          - notify
  schedule:
    # 08:30 JST = 23:30 UTC on the previous day.
    - cron: "30 23 * * *"

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch events and notify
        env:
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_TO: ${{ secrets.LINE_TO }}
        run: |
          MODE="${{ github.event.inputs.mode || 'notify' }}"
          python app.py "$MODE"
